# K2 (A-016): same prod image as ECS, applied by digest.
# kubectl: sed "s|IMAGE_PLACEHOLDER|<account>.dkr.ecr.eu-west-1.amazonaws.com/delivery-app@sha256:...|" k8s/delivery-app.yaml | kubectl apply -f -
# Delete the Service before terraform destroy, or the ELB security group blocks the VPC deletion.
apiVersion: apps/v1
kind: Deployment
metadata: {name: delivery-app, labels: {app: delivery-app}}
spec:
  replicas: 1
  selector: {matchLabels: {app: delivery-app}}
  template:
    metadata: {labels: {app: delivery-app}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {memory: 512Mi}}
        securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: delivery-app}
spec:
  type: LoadBalancer
  selector: {app: delivery-app}
  ports: [{port: 80, targetPort: 8080}]
